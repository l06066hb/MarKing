name: Cross-Platform Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write 
    strategy:
      fail-fast: false
      matrix: 
        include:
          # Windows (x64)
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
            target: x86_64-pc-windows-msvc
            arch_label: 'x64'
          # macOS Intel (x64) — macos-latest 上交叉编译
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            target: x86_64-apple-darwin
            arch_label: 'x64'
          # macOS Apple Silicon (arm64)
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            target: aarch64-apple-darwin
            arch_label: 'aarch64'
          # Linux (x64)
          - platform: ubuntu-22.04
            args: ''
            target: x86_64-unknown-linux-gnu
            arch_label: 'x64'
          # Linux (ARM64) — 与 x64 同一 ubuntu-22.04 基线；--bundles deb 仅出 deb
          - platform: ubuntu-22.04-arm
            args: '--bundles deb'
            target: aarch64-unknown-linux-gnu
            arch_label: 'arm64'

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Setup SSH For Gitee
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555  # v0.10.0
        with:
          ssh-private-key: ${{ secrets.GITEE_PRIVATE_KEY }}

      - name: Configure Git & SSH for Gitee
        shell: bash
        run: |
          mkdir -p ~/.ssh

          echo "--- DNS resolve ---"
          getent hosts gitee.com 2>&1 || nslookup gitee.com 2>&1 || echo "DNS lookup failed"
          echo "--- TCP 22 connectivity ---"
          timeout 5 bash -c 'cat < /dev/tcp/gitee.com/22' </dev/null 2>&1 | head -1 \
            && echo "TCP/22 OK" || echo "TCP/22 BLOCKED or TIMEOUT"
          echo "--- TCP 443 connectivity ---"
          curl -sS -m 5 -o /dev/null -w "HTTPS HTTP status: %{http_code}\n" https://gitee.com/ 2>&1 \
            || echo "HTTPS to gitee.com failed"
          echo "--- end diagnostics ---"

          echo "--- ssh-keyscan gitee.com ---"
          # keyscan 偶发失败不致命，accept-new 兜底首次连接
          ssh-keyscan -v -T 10 gitee.com >> ~/.ssh/known_hosts || \
            echo "::warning::ssh-keyscan failed; relying on accept-new fallback"
          # 大 pack 传输：加大 buffer、关闭压缩降低传输中断率
          git config --global http.postBuffer 1048576000
          git config --global core.compression 0
          # SSH 保活 + 首连自动信任
          cat >> ~/.ssh/config << 'EOF'
          Host gitee.com
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 10
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

      # 源码镜像缓存：命中后仅需 fetch 目标 ref 的对象增量。
      # 缓存过期不影响正确性——fetch 总是拉取最新目标 ref。
      - name: Cache Gitee source mirror
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/marking-src-mirror
          key: marking-src-mirror-v1

      # 镜像命中则增量 fetch，否则全量克隆；git archive 导出工作区（构建不依赖 .git）。
      - name: Clone Gitee Private Repository (with retry)
        shell: bash
        env:
          GITEE_URL: ${{ secrets.GITEE_REPO_SSH_URL }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set +e
          set -o pipefail
          MIRROR="$HOME/marking-src-mirror"
          WS="$(pwd)"

          # 全限定 refspec 拉取目标 ref，规避 --single-branch 镜像的 refspec 限制
          if [ "$REF_TYPE" = "tag" ]; then
            TARGET_REF="refs/tags/$REF_NAME"
          else
            TARGET_REF="refs/heads/$REF_NAME"
          fi

          for attempt in 1 2 3 4 5; do
            echo "::group::Source attempt $attempt"
            SRC_REF=""

            if [ -f "$MIRROR/HEAD" ]; then
              # 增量拉取目标 ref 到 FETCH_HEAD；URL 取自 env 而非镜像 config。
              # -q 避免日志输出远端地址；失败则丢弃镜像走全量克隆。
              if git -C "$MIRROR" fetch -q --depth 1 "$GITEE_URL" "$TARGET_REF"; then
                SRC_REF="FETCH_HEAD"
              else
                echo "::warning::Mirror fetch failed, falling back to fresh clone"
                rm -rf "$MIRROR"
              fi
            fi

            if [ -z "$SRC_REF" ]; then
              rm -rf "$MIRROR"
              if git clone --bare --depth 1 --no-tags --single-branch \
                  -b "$REF_NAME" "$GITEE_URL" "$MIRROR"; then
                SRC_REF="HEAD"
              fi
            fi

            if [ -n "$SRC_REF" ] && git -C "$MIRROR" archive "$SRC_REF" | tar -x -C "$WS"; then
              echo "Source ready on attempt $attempt (ref: $SRC_REF)"
              echo "::endgroup::"
              exit 0
            fi

            # 导出失败丢弃镜像，下一轮重试走全量克隆自愈
            [ -n "$SRC_REF" ] && echo "::warning::Archive from mirror failed, discarding mirror"
            rm -rf "$MIRROR"

            echo "::endgroup::"
            echo "Attempt $attempt failed, cleaning workspace..."
            shopt -s dotglob nullglob
            rm -rf "$WS"/* || true
            shopt -u dotglob nullglob
            # 指数退避：10s, 20s, 30s, 40s
            sleep $((attempt * 10))
          done
          # 错误信息不含仓库地址
          echo "::error::All 5 clone attempts failed - check Gitee SSH key and network connectivity"
          exit 1

      - name: Install dependencies (Ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Install Rust and Targets
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: ${{ matrix.target }} 

      # Rust 编译缓存，按 target 区分避免冲突
      - name: Rust Cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: "marking-${{ matrix.target }}-v2"
          cache-bin: false

      # macOS：仅保留当前架构 pandoc sidecar 减小包体积；
      # 命名格式 marking-pandoc-<target-triple>（marking- 前缀避免与系统 pandoc 冲突）
      - name: Prepare Pandoc sidecar (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          echo "Target: ${{ matrix.target }}"
          KEEP="src-tauri/binaries/marking-pandoc-${{ matrix.target }}"
          echo "Keeping pandoc: $KEEP"
          # 删除非当前架构的 macOS pandoc 二进制
          for f in src-tauri/binaries/marking-pandoc-*-apple-darwin; do
            if [ "$f" != "$KEEP" ]; then
              echo "Removing unused pandoc: $f"
              rm -f "$f"
            fi
          done
          chmod +x "$KEEP"
          ls -lh src-tauri/binaries/marking-pandoc-*

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=4096'
        with:
          tagName: v__VERSION__ 
          releaseName: 'MarKing v__VERSION__'
          releaseBody: |
            全平台客户端安装包已编译完成，请根据您的系统下载对应版本：

            **macOS**
            - Apple Silicon (M1/M2/M3/M4/M5)：下载 `aarch64.dmg`
            - Intel 芯片：下载 `x64.dmg`
            - ⚠️ 如果打开时提示「已损坏，无法打开」，请在终端执行：`xattr -cr /Applications/MarKing.app` 然后重新打开即可。

            **Windows**
            - 下载 `.exe` 安装包（支持 64 位系统）

            **Linux**
            - x86_64：下载 `.deb` 或 `.AppImage`
            - ARM64（aarch64）：下载 `arm64.deb`
          releaseDraft: true 
          prerelease: false
          args: ${{ matrix.args }}

      
      - name: Repackage AppImage with FUSE3 runtime (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # 1. 定位 Tauri 生成的 AppImage
          APPIMAGE=$(find src-tauri/target target -name "*.AppImage" -type f 2>/dev/null | head -1 || true)
          if [ -z "$APPIMAGE" ]; then
            echo "::warning::No AppImage found, skipping FUSE3 repackage"
            echo "--- Debug: bundle dir contents ---"
            find src-tauri/target -type d -name "bundle" 2>/dev/null || true
            find target -type d -name "bundle" 2>/dev/null || true
            exit 0
          fi
          BASENAME=$(basename "$APPIMAGE")
          echo "Original AppImage: $APPIMAGE"

          # 2. 提取（--appimage-extract 不需要 FUSE，CI 环境安全）
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract

          # 3. 下载 appimagetool / type2-runtime（固定版本 + sha256 校验）
          APPIMAGETOOL_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"  # 1.9.1
          RUNTIME_SHA256="2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"      # 20251108

          wget -q "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage" \
            -O appimagetool
          wget -q "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64" \
            -O runtime-fuse3

          echo "Verifying sha256 checksums..."
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          echo "${RUNTIME_SHA256}  runtime-fuse3" | sha256sum -c -

          chmod +x appimagetool runtime-fuse3

          # 4. 剔除 bundle 动态库走系统库（对齐 deb 行为，避免 ABI 不一致渲染异常；
          #    目标系统需有 libwebkit2gtk-4.1）
          echo "Stripping bundled libraries to use system versions"
          LIB_DIR="squashfs-root/usr/lib"
          if [ -d "$LIB_DIR" ]; then
            BEFORE_COUNT=$(find "$LIB_DIR" -maxdepth 1 -name '*.so*' -type f 2>/dev/null | wc -l)
            BEFORE_SIZE=$(du -sh "$LIB_DIR" 2>/dev/null | cut -f1)
            rm -f "$LIB_DIR"/*.so*
            AFTER_SIZE=$(du -sh "$LIB_DIR" 2>/dev/null | cut -f1)
            echo "Removed $BEFORE_COUNT bundled libraries (size: $BEFORE_SIZE -> $AFTER_SIZE)"
          else
            echo "::warning::$LIB_DIR not found, skipping library strip"
          fi

          # 5. 注入 WebKitGTK 兼容启动器：新版 WebKitGTK 的 compositing/DMABUF
          #    路径会导致卡 loading；AppRun wrapper 注入开关，环境变量可覆盖。
          APP_BIN=$(find squashfs-root/usr/bin -maxdepth 1 -type f -executable | head -1)
          if [ -n "$APP_BIN" ]; then
            BIN_NAME=$(basename "$APP_BIN")
            echo "Injecting WebKit-compat AppRun wrapper for: $BIN_NAME"
            rm -f squashfs-root/AppRun
            {
              echo '#!/bin/bash'
              echo 'HERE="$(dirname "$(readlink -f "${0}")")"'
              echo 'export WEBKIT_DISABLE_COMPOSITING_MODE="${WEBKIT_DISABLE_COMPOSITING_MODE:-1}"'
              echo 'export WEBKIT_DISABLE_DMABUF_RENDERER="${WEBKIT_DISABLE_DMABUF_RENDERER:-1}"'
              echo "exec \"\$HERE/usr/bin/${BIN_NAME}\" \"\$@\""
            } > squashfs-root/AppRun
            chmod +x squashfs-root/AppRun
            echo "--- AppRun content ---"
            cat squashfs-root/AppRun
          else
            echo "::warning::No executable found in usr/bin, keeping default AppRun"
          fi

          # 6. 用新 runtime 重新打包
          #    APPIMAGE_EXTRACT_AND_RUN=1 让 appimagetool 自身也无需 FUSE 即可运行
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool --runtime-file runtime-fuse3 squashfs-root "$BASENAME"
          echo "Repackaged with FUSE3-compatible runtime: $(ls -lh "$BASENAME" | awk '{print $5}')"

          # 7. 上传到 draft release（--clobber 替换 tauri-action 上传的 FUSE2 版本）
          RELEASE_TAG="v$(jq -r '.version' src-tauri/tauri.conf.json)"
          echo "Uploading to release: $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" "$BASENAME" --clobber --repo "${{ github.repository }}"

          # 8. 清理
          rm -rf squashfs-root appimagetool

  # 全部产物就绪后生成 SHA256SUMS.txt：下载 draft 资产 → sha256 → 回传 release
  checksums:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Generate SHA256 checksums
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          mkdir -p assets

          # tag push 精确匹配 tag；dispatch 取最新 release（draft 的 tag 接口不稳定）
          RELEASES=$(gh api "repos/${{ github.repository }}/releases?per_page=5")
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            REL_ID=$(echo "$RELEASES" | jq -r --arg tag "$TAG" \
              '.[] | select(.tag_name == $tag) | .id' | head -1)
          else
            TAG=$(echo "$RELEASES" | jq -r '.[0].tag_name // empty')
            REL_ID=$(echo "$RELEASES" | jq -r '.[0].id // empty')
          fi
          [ -n "$REL_ID" ] && [ "$REL_ID" != "null" ] && [ -n "$TAG" ] && [ "$TAG" != "null" ] \
            || { echo "::error::Release not found"; exit 1; }
          echo "Generating checksums for release: $TAG (id: $REL_ID)"

          # 按资产 id 下载（draft 资产需走 id 接口）；跳过旧 SHA256SUMS.txt 防自引用
          gh api "repos/${{ github.repository }}/releases/$REL_ID/assets?per_page=100" \
            --jq '.[] | "\(.id)\t\(.name)"' | \
          while IFS=$'\t' read -r id name; do
            name="${name##*/}"
            [ "$name" = "SHA256SUMS.txt" ] && continue
            gh api "repos/${{ github.repository }}/releases/assets/$id" \
              -H "Accept: application/octet-stream" > "assets/$name"
            echo "downloaded: $name"
          done

          cd assets
          sha256sum -- * > SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
